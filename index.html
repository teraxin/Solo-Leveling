<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@400;500;600;700&family=Oswald:wght@700&family=Russo+One&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#05070B; --panel:#0A121C; --panel2:#0D1826;
    --line:#1E3A4D; --glow:#4FE0FF; --glow-dim:#1E5A6E;
    --text:#D7F2FF; --text-dim:#5D7C8C; --warn:#FF5A4E;
    --xp:#6EE7FF; --ok:#39E28E; --glow-rgb:79,224,255;
    --core:#EAFBFF; color-scheme:dark; box-sizing:border-box;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;overscroll-behavior:none;background:#05070B;}
  body{
    margin:0; background:radial-gradient(ellipse at 50% -10%, #0E2233 0%, var(--bg) 55%);
    color:var(--text); font-family:'Rajdhani',sans-serif;
    overflow:hidden; overscroll-behavior:none;
  }
  .app{
    max-width:480px;margin:0 auto;padding-block:24px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
    height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;
  }
  h1,.num,.mono{font-family:'Orbitron',sans-serif;}

  header{text-align:center;margin-bottom:22px;}
  header .tag{font-size:.68rem;letter-spacing:.35em;color:var(--glow-dim);}
  header h1{font-size:1.5rem;margin:6px 0 2px;color:var(--glow);letter-spacing:.12em;
    text-shadow:0 0 14px rgba(var(--glow-rgb),.55);}
  header .sub{font-size:.82rem;color:var(--text-dim);}

  .panel{
    position:relative; background:linear-gradient(180deg,var(--panel),var(--panel2));
    border:1px solid rgba(var(--glow-rgb),.3); padding:18px 18px 20px; margin-bottom:16px;
    clip-path:polygon(14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%,0 14px);
    box-shadow:0 0 0 1px rgba(var(--glow-rgb),.05), 0 0 28px -10px rgba(var(--glow-rgb),.25) inset;
  }
  .glass-fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:0;}
  .panel > *:not(.glass-fx){position:relative;z-index:1;}

  .qtitle{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
  .bang{width:26px;height:26px;border:1px solid rgba(225,245,255,.8);border-radius:0;display:flex;align-items:center;
    justify-content:center;color:var(--glow);font-family:'Orbitron';font-size:.85rem;flex-shrink:0;
    background:rgba(var(--glow-rgb),.08);text-shadow:0 0 8px var(--glow);}
  .qtitle .qh{font-family:'Orbitron';font-size:.82rem;letter-spacing:.15em;color:var(--glow);
    border:1px solid rgba(225,245,255,.7);padding:6px 14px;background:rgba(var(--glow-rgb),.06);text-shadow:0 0 10px var(--glow);}

  .daytabs{display:flex;gap:8px;margin-bottom:14px;}
  .daytabs button{
    flex:1;background:#03080D;border:1px solid var(--line);color:var(--text-dim);font-family:'Orbitron';
    font-size:.72rem;padding:9px 4px;cursor:pointer;
  }
  .daytabs button.active{color:var(--glow);border-color:var(--glow);box-shadow:0 0 10px rgba(var(--glow-rgb),.3);
    background:rgba(var(--glow-rgb),.08);}

  .quest-desc{font-size:.85rem;color:var(--text-dim);margin-bottom:14px;font-style:italic;}

  .qrow{display:flex;align-items:center;gap:10px;margin-bottom:10px;cursor:pointer;}
  .qrow .lbl{flex:1;font-size:.9rem;}
  .qrow .lbl .set{display:block;font-size:.72rem;color:var(--text-dim);margin-top:1px;}
  .qrow .chk{width:20px;height:20px;border:1px solid rgba(225,245,255,.55);flex-shrink:0;}
  .qrow .chk.done{background:var(--glow);box-shadow:0 0 10px var(--glow);border-color:var(--glow);}

  .qactions{display:flex;gap:10px;margin-top:16px;}
  .btn{
    flex:1;background:transparent;border:1px solid var(--line);color:var(--text);font-family:'Orbitron';
    font-size:.72rem;letter-spacing:.08em;padding:11px 6px;cursor:pointer;text-transform:uppercase;
  }
  .btn.primary{border-color:var(--glow);color:var(--glow);box-shadow:0 0 12px rgba(var(--glow-rgb),.25);}
  .btn.primary:active{background:rgba(var(--glow-rgb),.12);}
  .btn.ghost{color:var(--text-dim);}

  .status-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
  .status-head .rank{
    width:52px;height:52px;border:2px solid var(--glow);border-radius:50%;display:flex;align-items:center;
    justify-content:center;font-family:'Orbitron';font-size:1.3rem;color:var(--glow);
    box-shadow:0 0 16px rgba(var(--glow-rgb),.4);flex-shrink:0;
  }
  .status-head .lvl-num{font-size:1.9rem;color:var(--glow);text-shadow:0 0 14px rgba(var(--glow-rgb),.5);}
  .status-head .lvl-lbl{font-size:.68rem;letter-spacing:.2em;color:var(--text-dim);}

  .stat{margin-bottom:14px;}
  .stat-top{display:flex;justify-content:space-between;font-size:.8rem;margin-bottom:5px;}
  .stat-top .name{color:var(--text);}
  .stat-top .lv{font-family:'Orbitron';color:var(--glow);font-size:.78rem;}
  .stat-bar{height:9px;background:#03080D;border:1px solid var(--line);position:relative;overflow:hidden;}
  .stat-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--glow-dim),var(--xp));
    box-shadow:0 0 8px var(--glow);transition:width .4s;}

  .streak-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
  .streak-row .n{font-family:'Orbitron';font-size:1.3rem;color:var(--ok);}
  .streak-row .l{font-size:.72rem;color:var(--text-dim);letter-spacing:.1em;}
  .history{display:flex;gap:5px;}
  .history .d{flex:1;aspect-ratio:1;border:1px solid var(--line);}
  .history .d.full{background:var(--ok);border-color:var(--ok);box-shadow:0 0 6px var(--ok);}
  .history .d.partial{background:var(--glow-dim);border-color:var(--glow);}

  .section-lbl{font-family:'Orbitron';font-size:.72rem;letter-spacing:.2em;color:var(--text-dim);margin:0 0 14px;}
  footer{text-align:center;color:var(--text-dim);font-size:.7rem;margin-top:10px;letter-spacing:.05em;}
  header{position:relative;}
  .snd{position:absolute;right:0;top:0;background:none;border:1px solid var(--line);color:var(--glow);font-family:'Orbitron';font-size:.68rem;letter-spacing:.05em;min-width:40px;height:34px;padding:0 8px;cursor:pointer;}
  .penalty{border-color:var(--warn);box-shadow:0 0 24px -8px rgba(255,90,78,.5) inset;}
  .penalty .qh{color:var(--warn);border-color:var(--warn);background:rgba(255,90,78,.08);}
  .penalty .bang{border-color:var(--warn);color:var(--warn);box-shadow:0 0 10px rgba(255,90,78,.6);}
  .penalty .chk.done{background:var(--warn);border-color:var(--warn);box-shadow:0 0 10px var(--warn);}
  .penalty .btn.primary{border-color:var(--warn);color:var(--warn);box-shadow:0 0 12px rgba(255,90,78,.3);}
  .sysmsg{position:fixed;left:12px;right:12px;top:calc(12px + env(safe-area-inset-top,0px));max-width:456px;margin:0 auto;z-index:50;
    transform:translateY(-160%);transition:transform .3s;background:#061019;border:1px solid var(--glow);padding:12px 14px;font-size:.92rem;
    display:flex;gap:10px;align-items:center;filter:drop-shadow(0 0 12px rgba(var(--glow-rgb),.45));
    clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px);}
  .sysmsg.show{transform:none;}
  .sysmsg.bad{border-color:var(--warn);}
  .sysmsg.bad .bang{border-color:var(--warn);color:var(--warn);box-shadow:0 0 10px var(--warn);}
  .sysmsg.up{border-color:var(--ok);}
  .sysmsg.up .bang{border-color:var(--ok);color:var(--ok);box-shadow:0 0 10px var(--ok);}
  .chips{display:flex;gap:6px;}
  .chips button{flex:1;min-width:0;background:#03080D;border:1px solid var(--line);color:var(--text-dim);font-family:'Orbitron';font-size:.66rem;padding:10px 0;cursor:pointer;}
  .chips button.on{color:var(--glow);border-color:var(--glow);background:rgba(var(--glow-rgb),.08);}
  .history .d.rest{border-style:dashed;opacity:.5;}
  .history .d.missed{background:var(--warn);border-color:var(--warn);box-shadow:0 0 6px var(--warn);}
  .hint{font-size:.74rem;color:var(--text-dim);margin-top:12px;line-height:1.35;}
  .cycle{display:flex;gap:6px;}
  .cycle .cell{flex:1;border:1px solid var(--line);padding:6px 0;text-align:center;font-family:'Orbitron';color:var(--text-dim);}
  .cycle .cell .n{display:block;font-size:.55rem;margin-bottom:2px;}
  .cycle .cell b{font-size:.85rem;}
  .cycle .cell.train{color:var(--text);}
  .cycle .cell.now{border-color:var(--glow);box-shadow:0 0 10px rgba(var(--glow-rgb),.4);color:var(--glow);}
  .awaken-overlay{
    position:fixed;inset:0;z-index:80;display:none;align-items:center;justify-content:center;padding:24px;
    background:radial-gradient(ellipse at 50% 40%,rgba(30,90,110,.35),rgba(2,4,7,.96) 70%);
    backdrop-filter:blur(2px);
  }
  .awaken-overlay.show{display:flex;animation:awakenFade .6s ease;}
  @keyframes awakenFade{from{opacity:0;}to{opacity:1;}}
  .awaken-box{text-align:center;max-width:380px;}
  .awaken-tag{font-family:'Orbitron';font-size:.7rem;letter-spacing:.35em;color:var(--glow-dim);margin-bottom:10px;}
  .awaken-title{font-family:'Orbitron';font-weight:900;font-size:1.7rem;color:var(--glow);letter-spacing:.06em;
    text-shadow:0 0 22px rgba(var(--glow-rgb),.8),0 0 46px rgba(var(--glow-rgb),.4);margin-bottom:14px;line-height:1.3;}
  .awaken-sub{font-size:.9rem;color:var(--text-dim);line-height:1.5;}
  .awaken-overlay.monarch{background:radial-gradient(ellipse at 50% 40%,rgba(123,97,255,.4),rgba(3,2,7,.97) 70%);}
  .awaken-overlay.monarch .awaken-title{color:#C9B6FF;text-shadow:0 0 24px rgba(201,182,255,.85),0 0 50px rgba(123,97,255,.5);}
  .awaken-overlay.monarch .awaken-tag{color:#7B61FF;}
  .title-lbl{font-size:.72rem;color:var(--glow);letter-spacing:.1em;margin-top:2px;}
  #introOverlay{
    position:fixed;inset:0;z-index:999;background:#000;display:flex;align-items:center;justify-content:center;
    flex-direction:column;cursor:pointer;transition:opacity 1s ease;
  }
  #introOverlay.hide{opacity:0;pointer-events:none;}
  .intro-tap{font-family:'Orbitron';font-size:.72rem;letter-spacing:.3em;color:var(--glow-dim);
    animation:introBlink 1.8s ease-in-out infinite;}
  @keyframes introBlink{0%,100%{opacity:.35;}50%{opacity:1;}}
  .intro-word{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);display:flex;}
  .intro-word span{
    font-family:'Oswald';font-weight:900;font-size:4.6rem;letter-spacing:.02em;color:#3454D1;
    opacity:0;transform:translateY(6px);display:inline-block;
    text-shadow:0 0 18px rgba(52,84,209,.65),0 0 40px rgba(52,84,209,.35);
    filter:url(#jaggedFilter);
    animation-duration:1.6s;animation-timing-function:ease-out;animation-fill-mode:forwards;
  }
  .intro-word.play span{animation-name:introLetter;}
  .intro-word.play span:nth-child(1){animation-delay:0s;}
  .intro-word.play span:nth-child(2){animation-delay:.4s;}
  .intro-word.play span:nth-child(3){animation-delay:.8s;}
  .intro-word.play span:nth-child(4){animation-delay:1.2s;}
  .intro-word.play span:nth-child(5){animation-delay:1.6s;}
  @keyframes introLetter{to{opacity:1;transform:none;}}
  .hud{position:relative;margin:20px 0 38px;}
  .hud .panel{margin-bottom:0;clip-path:none;
    background:
      linear-gradient(180deg,rgba(var(--glow-rgb),.22) 0,rgba(var(--glow-rgb),.06) 34px,rgba(var(--glow-rgb),0) 96px),
      linear-gradient(0deg,rgba(var(--glow-rgb),.22) 0,rgba(var(--glow-rgb),.06) 34px,rgba(var(--glow-rgb),0) 96px),
      linear-gradient(118deg,rgba(var(--glow-rgb),0) 28%,rgba(var(--glow-rgb),.06) 40%,rgba(var(--glow-rgb),0) 54%),
      linear-gradient(180deg,rgba(9,17,27,.94),rgba(7,13,22,.94));
    box-shadow:inset 0 0 46px -16px rgba(var(--glow-rgb),.4);}
  .hud-bar{position:absolute;left:-9px;right:-9px;height:4px;z-index:3;pointer-events:none;
    filter:drop-shadow(0 0 3px rgba(var(--glow-rgb),.95)) drop-shadow(0 0 10px rgba(var(--glow-rgb),.7)) drop-shadow(0 0 26px rgba(var(--glow-rgb),.42));
    animation:railBreath 5s ease-in-out infinite;}
  .hud-bar i{display:block;height:100%;
    background:
      radial-gradient(ellipse 52px 8px at 36% 50%,#fff 0,rgba(255,255,255,0) 100%),
      linear-gradient(180deg,rgba(var(--glow-rgb),1) 0,var(--core) 40%,#fff 52%,rgba(var(--glow-rgb),1) 100%);}
  .hud-bar.top{top:-2px;}
  .hud-bar.bottom{bottom:-2px;}
  .hud-bar.top i{clip-path:polygon(12px 0,100% 0,calc(100% - 12px) 100%,0 100%);}

function keyOf(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function todayKey(){return keyOf(new Date());}
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x;}
function parseKey(k){const p=k.split('-').map(Number);return new Date(p[0],p[1]-1,p[2]);}

function loadData(){
  let d=null;
  try{const raw=localStorage.getItem(STORE_KEY); if(raw) d=JSON.parse(raw);}catch(e){}
  d=d||{};
  d.history=d.history||{};
  d.missed=d.missed||{};
  d.settings=Object.assign({rest:[1,2],lang:'ru'}, d.settings||{});
  d.flags=Object.assign({awakened:false,monarch:false}, d.flags||{});
  d.restDates=d.restDates||{};
  if(!d.flags.amnesty2){ Object.keys(d.missed).forEach(k=>{d.missed[k].cleared=true;}); d.flags.amnesty2=true; }
  if(!d.checkedThrough) d.checkedThrough=keyOf(addDays(new Date(),-1));
  const hk=Object.keys(d.history).sort();
  if(hk.length) Object.keys(d.missed).forEach(k=>{if(k<hk[0]) delete d.missed[k];});
  return d;
}

let AC=null, master=null, pendingSfx=null;
function ac(){
  if(!AC){
    try{
      AC=new (window.AudioContext||window.webkitAudioContext)();
      master=AC.createGain(); master.gain.value=.7;
      const dl=AC.createDelay(); dl.delayTime.value=.16;
      const fb=AC.createGain(); fb.gain.value=.28;
      dl.connect(fb); fb.connect(dl);
      master.connect(AC.destination); master.connect(dl); dl.connect(AC.destination);
    }catch(e){return null;}
  }
  if(AC.state==='suspended') AC.resume();
  return AC;
}
let soundOn=false;
function tone(f,t,d,type,v,to){
  if(!soundOn) return;

function isRest(d){return data.settings.rest.indexOf(d.getDay())>=0||!!data.restDates[keyOf(d)];}
function doneCount(e){return (e&&!e.skipped&&e.done)?Object.values(e.done).filter(Boolean).length:0;}
function activePenalties(){return Object.keys(data.missed).filter(k=>!data.missed[k].cleared);}

function processMisses(){
  let added=0;
  const yesterday=addDays(new Date(),-1);
  let cur=addDays(parseKey(data.checkedThrough),1);
  while(cur<=yesterday){
    const k=keyOf(cur);
    if(!isRest(cur) && doneCount(data.history[k])<PASS_MIN && !data.missed[k]){
      data.missed[k]={cleared:false}; added++;
    }
    cur=addDays(cur,1);
  }
  data.checkedThrough=keyOf(yesterday);
  return added;
}

  const ks=Object.keys(data.history).filter(k=>doneCount(data.history[k])>0).sort();

function rawXP(stat){
  let xp=0;
  Object.values(data.history).forEach(e=>{
    if(!e) return;
    if(!e.skipped&&e.done) Object.keys(PLAN).forEach(d=>PLAN[d].exercises.forEach(ex=>{if(ex.stat===stat&&e.done[ex.id]) xp+=XP_PER_EXERCISE;}));
    if(e.extra) DAILY.forEach(ex=>{if(ex.stat===stat&&e.extra[ex.id]) xp+=XP_PER_EXERCISE;});
  });
  return xp;
}

function levelFromXP(xp){
  let level=1, cum=0;
  while(level<100){const need=50+level*8; if(cum+need>xp) break; cum+=need; level++;}
  return {level, progress:Math.max(0,Math.min(1,(xp-cum)/(50+level*8)))};
}

    setTimeout(()=>URL.revokeObjectURL(url),2000);
    sfx.ping(); showMsg(T[lang].msgExported,'up');
  }catch(e){ sfx.penalty(); showMsg(T[lang].msgExportFail,'bad'); }
}
function importProgress(evt){
  const file=evt.target.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=()=>{
    try{
      const parsed=JSON.parse(reader.result);
      if(!parsed||typeof parsed!=='object') throw 0;
      data=Object.assign({history:{},missed:{},settings:{}}, parsed);
      data.settings=Object.assign({rest:[1,2],lang:lang}, data.settings||{});
      data.flags=Object.assign({awakened:false,monarch:false}, data.flags||{});
      data.checkedThrough=data.checkedThrough||keyOf(addDays(new Date(),-1));
      data.restDates=data.restDates||{}; data.flags=Object.assign({awakened:false,monarch:false},data.flags||{});
      saveData(); lang=data.settings.lang||lang;
      selectedDay=suggestDay(); loadToday();
      sfx.cleared(); showMsg(T[lang].msgImported,'up');
      render();
    }catch(e){ sfx.penalty(); showMsg(T[lang].msgImportFail,'bad'); }
  };
  reader.readAsText(file);
  evt.target.value='';
}

function render(){
  applyLang();
  renderQuest(); renderDaily(); renderPenalty(); renderRestChips();

  const stats=getStats();
  Object.keys(stats).forEach(k=>{
    document.getElementById('lv-'+k).textContent='Lv '+stats[k].level;
    document.getElementById('bar-'+k).style.width=Math.round(stats[k].progress*100)+'%';
  });
  const overall=Math.round((stats.str.level+stats.back.level+stats.legs.level+stats.core.level+stats.neck.level+stats.wrist.level)/6);
  document.getElementById('overallLevel').textContent=overall;
  const rank=rankFor(overall);
  document.getElementById('rankBadge').textContent=rank;
  document.getElementById('titleLbl').textContent=TITLES[rank][lang];
  document.documentElement.classList.toggle('monarch',rank==='S');
  if(glassMon!==(rank==='S')){glassMon=(rank==='S');scheduleGlass();}

  if(!data.flags.awakened && overall>=AWAKEN_LEVEL){
    data.flags.awakened=true; saveData();
    setTimeout(()=>showAwakening('awaken'),300);
  } else if(data.flags.awakened && !data.flags.monarch && rank==='S'){
    data.flags.monarch=true; saveData();
    setTimeout(()=>showAwakening('monarch'),300);
  }

  const row=document.getElementById('historyRow'); row.innerHTML='';
  for(let i=13;i>=0;i--){
    const d=addDays(new Date(),-i), k=keyOf(d), en=data.history[k];
    const el=document.createElement('div'); el.className='d';
    const dc=doneCount(en);
    if(data.missed[k]) el.classList.add('missed');
    else if(en&&!en.skipped&&dc>0){
      const full=Object.keys(PLAN).some(p=>PLAN[p].exercises.every(ex=>en.done&&en.done[ex.id]));
      el.classList.add(full?'full':'partial');
    } else if(isRest(d)) el.classList.add('rest');
    row.appendChild(el);
  }

  let streak=0;
  for(let i=0;i<365;i++){
    const d=addDays(new Date(),-i), en=data.history[keyOf(d)];
    if(doneCount(en)>=PASS_MIN) streak++;
    else if(isRest(d)||i===0) continue;
    else break;
  }
  document.getElementById('streakNum').textContent=streak;
  document.getElementById('totalDays').textContent=T[lang].totalLbl+Object.values(data.history).filter(x=>doneCount(x)>0).length;
}

/* ---------- Стекло с трещинами ---------- */
let glassMon=null, glassRaf=0;
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function buildCracks(w,h,rnd){
  const cracks=[], shards=[], out=60, TAU=6.283;
  function grow(x,y,a,len,depth){
    const pts=[[x,y]]; let d=0;
    while(d<len){
      const st=9+rnd()*16;
      a+=(rnd()-.5)*.42;
      x+=Math.cos(a)*st; y+=Math.sin(a)*st; d+=st;
      pts.push([x,y]);
      if(x<-out||x>w+out||y<-out||y>h+out) break;
      if(depth<3&&rnd()<.17) grow(x,y,a+(rnd()<.5?-1:1)*(.45+rnd()*.8),(len-d)*(.4+rnd()*.35),depth+1);
    }
    cracks.push({pts:pts,depth:Math.min(depth,2)});
  }
  const n=Math.max(2,Math.round(w*h/60000));
  for(let i=0;i<n;i++){
    const cx=rnd()*w, cy=rnd()*h, rays=6+Math.floor(rnd()*5), base=rnd()*TAU, ang=[];
    for(let k=0;k<rays;k++){
      const a=base+k*TAU/rays+(rnd()-.5)*.5; ang.push(a);
      grow(cx,cy,a,70+rnd()*210,0);
    }
    for(let k=0;k<rays;k++){
      const a1=ang[k], a2=ang[(k+1)%rays]+(k===rays-1?TAU:0), R=60+rnd()*120;
      if(rnd()<.55) shards.push({pts:[[cx,cy],[cx+Math.cos(a1)*R,cy+Math.sin(a1)*R],[cx+Math.cos(a2)*R,cy+Math.sin(a2)*R]],a:.02+rnd()*.045});
      [24+rnd()*14,62+rnd()*26].forEach(rr=>{
        if(rnd()<.4) return;
        const m=(a1+a2)/2, k2=rr*(.94+rnd()*.1);
        cracks.push({pts:[[cx+Math.cos(a1)*rr,cy+Math.sin(a1)*rr],[cx+Math.cos(m)*k2,cy+Math.sin(m)*k2],[cx+Math.cos(a2)*rr,cy+Math.sin(a2)*rr]],depth:2});
      });
    }
  }
  const sc=Math.max(3,Math.round(w*h/90000)+2);
  for(let i=0;i<sc;i++){
    const x=rnd()*w, y=rnd()*h, a=rnd()*TAU, l=120+rnd()*260;
    cracks.push({pts:[[x,y],[x+Math.cos(a)*l,y+Math.sin(a)*l]],depth:3});
  }
  return {cracks:cracks,shards:shards};
}
function drawGlass(panel){
  const w=panel.clientWidth, h=panel.clientHeight;
  if(!w||!h) return;
  let cv=panel.querySelector(':scope > canvas.glass-fx');
  if(!cv){cv=document.createElement('canvas');cv.className='glass-fx';cv.setAttribute('aria-hidden','true');panel.insertBefore(cv,panel.firstChild);}
  const dpr=Math.min(2,window.devicePixelRatio||1);
  cv.width=Math.round(w*dpr); cv.height=Math.round(h*dpr);
  const ctx=cv.getContext('2d'); if(!ctx) return;
  ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,w,h);
  const rgb=(getComputedStyle(document.documentElement).getPropertyValue('--glow-rgb')||'79,224,255').trim();
  const idx=Array.prototype.indexOf.call(document.querySelectorAll('.panel'),panel);
  const g=buildCracks(w,h,mulberry32(1701+idx*7919));
  ctx.lineCap='round'; ctx.lineJoin='round';
  // мягкие грани осколков
  ctx.globalCompositeOperation='lighter';
  g.shards.forEach(sh=>{ctx.beginPath();sh.pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.closePath();ctx.fillStyle='rgba('+rgb+','+sh.a.toFixed(3)+')';ctx.fill();});
  // тень: трещина «вырезана» в стекле
  ctx.globalCompositeOperation='source-over';
  g.cracks.forEach(c=>{
    ctx.beginPath(); c.pts.forEach((p,i)=>i?ctx.lineTo(p[0]+1,p[1]+1.2):ctx.moveTo(p[0]+1,p[1]+1.2));
    ctx.strokeStyle='rgba(0,0,0,'+(.42-c.depth*.07).toFixed(2)+')'; ctx.lineWidth=[2.1,1.7,1.5,1.3][c.depth]; ctx.stroke();
  });
  // свечение и тонкая цветная кромка
  ctx.globalCompositeOperation='lighter';
  g.cracks.forEach(c=>{
    ctx.beginPath(); c.pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));
    ctx.strokeStyle='rgba('+rgb+','+(.055-c.depth*.01).toFixed(3)+')'; ctx.lineWidth=4; ctx.stroke();
    const n=c.pts.length-1;
    for(let i=0;i<n;i++){
      const a=(.22-c.depth*.035)*(1-i/Math.max(1,n)*.75);
      ctx.beginPath(); ctx.moveTo(c.pts[i][0],c.pts[i][1]); ctx.lineTo(c.pts[i+1][0],c.pts[i+1][1]);
      ctx.strokeStyle='rgba('+rgb+','+a.toFixed(3)+')'; ctx.lineWidth=.7; ctx.stroke();
    }
  });
  ctx.globalCompositeOperation='source-over';
}
function drawAllGlass(){document.querySelectorAll('.panel').forEach(drawGlass);}
function scheduleGlass(){cancelAnimationFrame(glassRaf);glassRaf=requestAnimationFrame(drawAllGlass);}
(function initGlass(){
  if('ResizeObserver' in window){const ro=new ResizeObserver(scheduleGlass);document.querySelectorAll('.panel').forEach(p=>ro.observe(p));}
  else window.addEventListener('resize',scheduleGlass);
  if(document.fonts&&document.fonts.ready) document.fonts.ready.then(scheduleGlass);
})();

  const k=todayKey();
  if(k===currentDayKey) return;
  currentDayKey=k;
  checks={}; dailyChecks={}; selectedDay=suggestDay();
  const n=processMisses(); saveData(); render();

}

loadToday();
render();

  setTimeout(()=>{showMsg(T[lang].msgFailN(activePenalties().length),'bad');},400);
  playOrQueue('penalty');

  if(now.getHours()>=20 && !isRest(now) && doneCount(data.history[todayKey()])<PASS_MIN && data.lastReminder!==todayKey()){

  }
}
